# VeritasESG — questionnaire_autofill smoke-eval config.
#
# Verified against hermit-harness 0.1.0's actual config.py/defaults.yaml
# (read directly from the installed package) and the real canonical
# example at docs/_examples/first_training/run.yaml in the Hermit repo —
# not guessed. Confirmed working: `hermit check` passes and `hermit eval
# --adapter none` runs case VE-001 against the real, running VeritasESG app.
#
# evolver.name is required by Hermit's schema validation even for
# `hermit eval` (hermit/config.py Config.validate()), but hermit.evaluate
# never resolves or calls it — only hermit.trainer.Trainer does. The value
# below is a harmless placeholder for this evaluation-only phase.

data:
  tasks: ../datasets/questionnaire_autofill/starter.jsonl
  train: ../datasets/questionnaire_autofill/train.txt
  test: ../datasets/questionnaire_autofill/test.txt
  step_size: 1
  shuffle: false

task_info: ../pipelines/questionnaire_autofill/task-info

agent:
  name: ../pipelines/questionnaire_autofill/pipeline.py:run
  concurrency: 1

judge:
  path: ../pipelines/questionnaire_autofill/judge.py

template: prompt-only@1.0

evolver:
  name: not-used-for-eval-only   # see note above; not resolved by `hermit eval`

trainer:
  output_dir: ../results/questionnaire_autofill   # keep run output out of hermit/configs/ (gitignored, see hermit/results/)

sandbox:
  enabled: false   # plain HTTP calls from pipeline.py; no sandboxed subprocess needed

eval:
  repeats: 1
