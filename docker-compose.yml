# Full local stack: app + Postgres/pgvector + MinIO (MinIO services match docker-compose.minio.yml).
#
# Prerequisites: copy .env.example to .env and set at least JWT_SECRET, PLATFORM_API_KEY,
# RESEND_*, GEMINI_API_KEY, VITE_GEMINI_API_KEY (and any other vars you use).
#
#   npm run docker:up          # auto-picks a free host port for any port already in use
#   docker compose up --build  # plain compose; fails if a host port is already taken
#
# App http://localhost:3010  |  MinIO API :9000  |  MinIO console :9001 (minioadmin / minioadmin)
# Every host port below is overridable (${VAR:-default}); `npm run docker:up` sets these
# automatically to the next free port when the default is already bound on the host.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  # Relational core + RAG vector store. Populate via `npm run sql:setup`.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance
      POSTGRES_DB: governance
    ports:
      # Host 5442 (5432 is often taken by other local Postgres containers);
      # in-cluster services still reach it as postgres:5432.
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...' && sleep 1;
      done &&
      mc mb local/governance-uploads --ignore-existing &&
      mc anonymous set download local/governance-uploads &&
      echo 'MinIO bucket ready (anonymous download: local dev only).'
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
    ports:
      - "${APP_HOST_PORT:-3010}:3010"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Scheduled backup jobs (server/lib/schedulerService.ts) substitute $PWD with
      # BACKUP_HOST_PWD (the host repo path) before running; bind-mounting the same
      # absolute path here means pg_dump output written to "$PWD/backups"
      # inside the container lands in ./backups on the host, not lost on container recreate.
      - ${PWD}/backups:${PWD}/backups
    environment:
      PORT: "3010"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3010}
      S3_BUCKET: governance-uploads
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      # Public avatar URLs: https://{APP_PUBLIC_URL}/storage/governance-uploads/...
      # Override only if using an external CDN: S3_PUBLIC_URL_BASE=https://cdn.example.com/governance-uploads
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: ${DATABASE_URL:-postgresql://governance:governance@postgres:5432/governance}
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql://governance:governance@postgres:5432/governance}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
      BACKUP_HOST_PWD: ${PWD}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  qdrant_data:
  postgres_data:
